<div class="home-container">

    <!-- TOPO (PRETO COM LOGO) -->
    <div class="header">
        <img src="logo.png" class="main-logo">
    </div>

    <!-- PARTE DE BAIXO (CARDS) -->
    <div class="content">

        <div class="grid">

            <div class="ultrix-card" #menuCard tabindex="0" (click)="goLive()" (keydown.enter)="goLive()">
                <img src="icons/tv.png" alt="TV Ao Vivo">
                <span>TV Ao Vivo</span>
            </div>

            <div class="ultrix-card" #menuCard tabindex="0" (click)="goMovies()" (keydown.enter)="goMovies()">
                <img src="icons/filmes.png" alt="Filmes">
                <span>Filmes</span>
            </div>

            <div class="ultrix-card" #menuCard tabindex="0" (click)="goSeries()" (keydown.enter)="goSeries()">
                <img src="icons/series.png" alt="Séries">
                <span>Séries</span>
            </div>

            <div class="ultrix-card" #menuCard tabindex="0" (click)="openConfig()" (keydown.enter)="openConfig()">
                <img src="icons/config.png" alt="Configurações">
                <span>Configurações</span>
            </div>

        </div>

    </div>

</div>
